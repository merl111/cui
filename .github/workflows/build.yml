name: macOS bitmap diagnosis
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: clang -fno-objc-arc -framework AppKit tests/macos_bitmap_probe.m -o /tmp/probe && /tmp/probe
      - uses: actions/upload-artifact@v4
        with:
          name: bitmap-probe
          path: probe-*.png
